[project]
name = "forgecompile"
version = "0.0.1"
description = "ForgeCompile: an ML-guided optimizing compiler for the MiniLang language, with an LLVM backend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rsoumyadeep", email = "sdroy.csa.iisc@gmail.com" }]
# Runtime dependencies are added only in the phase that needs them
# (see docs/DECISIONS.md, D-007).
dependencies = []

[project.scripts]
forgecompile = "forgecompile.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgecompile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "slow: long-running tests (benchmarks, training); deselect with -m 'not slow'",
    "native: tests that build and execute native binaries",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # import sorting
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplifications
    "RUF",           # ruff-specific
]

[tool.mypy]
python_version = "3.11"
files = ["src/forgecompile"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
